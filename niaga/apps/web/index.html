<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niaga — pasar ekspor impor Indonesia terverifikasi</title>
    <meta
      name="description"
      content="Niaga menghubungkan eksportir Indonesia dengan pembeli, dan importir dengan pemasok. Status verifikasi terlihat di setiap listing."
    />
    <meta name="theme-color" content="#E9ECE8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1B26" media="(prefers-color-scheme: dark)" />

    <!--
      Resolve the theme before first paint so dark mode never flashes light.
      Mirrors `themeBootstrapScript` in @niaga/ui — duplicated because this has
      to run without React.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('niaga.theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Archivo is loaded across its width axis so the expanded cut is available
      for display type; IBM Plex Sans for body, IBM Plex Mono for data.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
