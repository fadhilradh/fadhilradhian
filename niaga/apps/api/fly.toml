# fly launch --no-deploy already done? If not: fly launch --copy-config --no-deploy
# Region sin (Singapore) is the closest Fly region to Jakarta and matches the
# Neon region, so the API-to-database hop stays inside one metro.
app = "niaga-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine stays warm: a cold start on the API is the difference between a
  # search that feels instant and one that feels broken.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 120

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Secrets are set out of band, never in this file:
#   fly secrets set DATABASE_URL=... CORS_ORIGINS=https://niaga.netlify.app
