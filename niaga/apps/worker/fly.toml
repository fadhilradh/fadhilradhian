app = "niaga-worker"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"

# No [http_service]: the worker takes work from Postgres, so it needs no inbound
# port and no public address. It must not stop, or scheduled jobs never fire.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[processes]
  worker = "node apps/worker/dist/index.js"

# fly secrets set DATABASE_URL=... RESEND_API_KEY=...
