name: niaga ci

on:
  push:
    branches: ['**']
    paths:
      - 'niaga/**'
      - '.github/workflows/niaga-ci.yml'
  pull_request:
    paths:
      - 'niaga/**'
      - '.github/workflows/niaga-ci.yml'

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: niaga-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: niaga

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: niaga/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
